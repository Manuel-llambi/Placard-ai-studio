    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Suppress third-party browser extension errors (such as MetaMask or wallet injection into iframes)
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? String(e.message) : '';
        var file = (e && e.filename) ? String(e.filename) : '';
        if (
          msg.includes('MetaMask') ||
          msg.includes('ethereum') ||
          msg.includes('evm') ||
          file.includes('chrome-extension') ||
          file.includes('moz-extension')
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        var reason = (e && e.reason) ? String(e.reason.message || e.reason) : '';
        if (
          reason.includes('MetaMask') ||
          reason.includes('ethereum') ||
          reason.includes('evm')
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
  </head>

  </body>
